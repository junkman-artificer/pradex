[project]
site_url = "https://junkman-artificer.github.io/pradex/"
site_name = "Pradex"

# site_description = "A field guide to the world of Prado"
# site_author = "Ezraek"

# copyright = "Copyright &copy; 2026 Ezraek"

repo_url = "https://github.com/junkman-artificer/pradex"
repo_name = "junkman-artificer/pradex"
# edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    "getting-started/index.md",
    { "First Steps" = "getting-started/first-steps.md" },
    { "Core Concepts" = "getting-started/core-concepts.md" },
    { "FAQ" = "getting-started/faq.md" },
  ] },
  { "Character Creation" = "character-creation/index.md" },
  { "Classes" = [
    "classes/index.md",
    { "Warrior" = "classes/warrior.md" },
    { "Magician" = "classes/magician.md" },
    { "Thief" = "classes/thief.md" },
    { "Priest" = "classes/priest.md" },
    { "Bard" = "classes/bard.md" },
    { "Blood Knight" = "classes/blood-knight.md" },
    { "Ranger" = "classes/ranger.md" },
  ] },
  { "Gearing Up" = [
    "gearing-up/index.md",
    { "Rarity" = "gearing-up/rarity.md" },
    { "Stats" = "gearing-up/stats.md" },
    { "Where to Get Gear" = "gearing-up/sources.md" },
  ] },
  { "Crafting" = "crafting/index.md" },
  { "Enchanting" = "enchanting/index.md" },
  { "Parties" = "parties/index.md" },
  { "Waystones" = [
    "waystones/index.md",
    { "Maximizing Waystones" = "waystones/maximizing.md" },
    { "Regions" = [
      "waystones/regions/index.md",
      { "Sweetwater" = "waystones/regions/sweetwater.md" },
      { "Eastern Gate" = "waystones/regions/eastern-gate.md" },
      { "The Burrows" = "waystones/regions/the-burrows.md" },
      { "Gloomhaven" = "waystones/regions/gloomhaven.md" },
      { "Briarstone Quarry" = "waystones/regions/briarstone-quarry.md" },
    ] },
  ] },
  { "Economy" = "economy/index.md" },
  { "Reference" = "reference/index.md" },
]

extra_css = [
  "stylesheets/extra.css",
]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
variant = "classic"
# custom_dir = "overrides"
favicon = "images/favicon.ico"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  # "navigation.sections",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

logo = "images/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "light-green"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "light-green"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/user/repo"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
